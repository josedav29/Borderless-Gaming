name: Build Borderless Gaming Online

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore BorderlessGaming.sln

    - name: Build Release executable
      run: msbuild BorderlessGaming.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload compiled EXE
      uses: actions/upload-artifact@v4
      with:
        name: BorderlessGaming-Executable
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
